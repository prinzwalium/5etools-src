name: Character Sheet CI

# Runs on every push and pull request touching the fork's Character Sheet, so a regression is
# caught here rather than in a playtest. Three layers, cheapest first:
#   lint → unit tests (pure rules) → browser tests (the pages, driven for real)

on:
   push:
      branches:
         - main
         - beta
   pull_request:
      branches:
         - main
         - beta
   # Allow running manually from the Actions tab
   workflow_dispatch:

concurrency:
   group: "charactersheet-ci-${{ github.ref }}"
   cancel-in-progress: true

jobs:
   test:
      runs-on: ubuntu-latest
      steps:
         -  uses: actions/checkout@v4

         -  uses: actions/setup-node@v4
            with:
               node-version: 'lts/*'
               cache: 'npm'

         -  name: Install dependencies
            run: npm ci --engine-strict=false

         -  name: Lint
            run: |
               npx eslint .
               npx stylelint scss/charactersheet.scss

         # `no-undef` is off repo-wide (5etools' script-tag globals), so a missing import is not a
         # lint error — it is a ReferenceError the moment somebody clicks the thing. This runs the
         # rule over the fork's modules only, with those globals declared.
         -  name: No undefined symbols
            run: node scripts/check-charactersheet-imports.mjs

         -  name: Unit tests
            run: npm run test:unit -- test/jest/CharacterSheet test/jest/DeployDefaults

         # The generated pages must match their templates, or the browser tests below would be
         # testing something that is not in the repo.
         -  name: Generated pages are up to date
            run: |
               node node/generate-pages.js
               if [ -n "$(git status --porcelain -- '*.html')" ]; then
                  echo "::error::A generated page (charactersheet.html / charbuilder.html / sidekick.html) is stale — run 'node node/generate-pages.js' and commit the result."
                  git --no-pager diff --stat -- '*.html'
                  exit 1
               fi

         # The runner ships with Chrome; the test helper finds it. A pinned Playwright build is
         # preferred when it downloads, so try for one but do not fail the run over it.
         -  name: Fetch a browser (best effort)
            continue-on-error: true
            run: npx playwright-core install chromium

         -  name: Browser tests
            run: |
               npm run build:css
               npm run test:e2e

         -  name: Upload failure screenshots
            if: failure()
            uses: actions/upload-artifact@v4
            with:
               name: e2e-failure-screenshots
               path: test/e2e/screenshots/
               if-no-files-found: ignore
               retention-days: 7
