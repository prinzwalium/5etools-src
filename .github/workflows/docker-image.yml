name: Build Docker Image

on:
   push:
      branches:
         - main
         # `beta` is the integration branch for work-in-progress: pushing to it publishes a
         # `:beta` image for testing, while `:latest` stays pinned to the default branch (`main`).
         - beta
   pull_request:
      branches:
         - main
   # Allow running manually from the actions tab
   workflow_dispatch:

env:
   REGISTRY: ghcr.io
   IMAGE_NAME: ${{ github.repository }}

concurrency:
   group: "docker-image-${{ github.ref }}"
   cancel-in-progress: true

jobs:
   build-image:
      # A pull request whose branch lives in *this* repository is already built by the `push`
      # trigger above, on the same commit — and this run publishes nothing, since `push:` below is
      # false for a pull request. Two builds of one commit means two simultaneous pulls of the base
      # image's 6.6 GB layer, which is how a green build turned into `429 Too Many Requests` from
      # ghcr.io. A pull request from a *fork* has no push build behind it, so that one still runs:
      # it is the only case where this event proves anything the push event has not.
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
      runs-on: ubuntu-latest
      permissions:
         contents: read
         packages: write
      steps:
         -  uses: actions/checkout@v4

         -  uses: actions/setup-node@v4
            with:
               node-version: '24'

         -  name: Build Site
            run: |
               npm ci
               node node/generate-pages.js
               npm run build:css
               npm run build:sw:prod

         -  name: Set Up Docker Buildx
            uses: docker/setup-buildx-action@v3

         # Only log in / push for events that can access the registry
         # (i.e. not PRs from forks).
         -  name: Log In to Registry
            if: github.event_name != 'pull_request'
            uses: docker/login-action@v3
            with:
               registry: ${{ env.REGISTRY }}
               username: ${{ github.actor }}
               password: ${{ secrets.GITHUB_TOKEN }}

         -  name: Extract Image Metadata
            id: meta
            uses: docker/metadata-action@v5
            with:
               images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
               tags: |
                  type=ref,event=branch
                  type=ref,event=pr
                  type=sha
                  type=raw,value=latest,enable={{is_default_branch}}

         -  name: Build and Push Image
            uses: docker/build-push-action@v6
            with:
               context: .
               file: ./Dockerfile
               push: ${{ github.event_name != 'pull_request' }}
               tags: ${{ steps.meta.outputs.tags }}
               labels: ${{ steps.meta.outputs.labels }}
               cache-from: type=gha
               cache-to: type=gha,mode=max
