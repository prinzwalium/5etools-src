name: Build Docker Image

# The fork's one addition to upstream 5etools: a small image of the site (`docker/Dockerfile`),
# published to ghcr.io for amd64 and arm64. Everything else in this repository is upstream's.
#
#   main → :latest and :<version>      beta → :beta      every build → :sha-<commit>
#
# Runs on a push, by hand, and from `sync-upstream.yml` after it merges an upstream release (a push
# made with the workflow's own token starts no workflow, so the sync starts this one itself).

on:
   push:
      branches:
         - main
         - beta
   # Allow running manually from the actions tab
   workflow_dispatch:

env:
   REGISTRY: ghcr.io
   IMAGE_NAME: ${{ github.repository }}
   # What the image may weigh unpacked. It is about 170 MB, nearly all of it 5etools' data; upstream's
   # own image carries every picture and is gigabytes. A build over this fails before anything is
   # published, so an upstream change that would bring the pictures in cannot ship unnoticed
   SIZE_BUDGET_MB: 300

concurrency:
   group: "docker-image-${{ github.ref }}"
   cancel-in-progress: true

jobs:
   build-image:
      runs-on: ubuntu-latest
      permissions:
         contents: read
         packages: write
      steps:
         -  uses: actions/checkout@v4

         -  name: Read Version
            id: version
            run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

         -  name: Set Up Docker Buildx
            uses: docker/setup-buildx-action@v3

         # Build for this runner and serve it before anything is published: the site's front page, its
         # data and its service worker answer, compressed
         -  name: Build Image for the Smoke Test
            uses: docker/build-push-action@v6
            with:
               context: .
               file: docker/Dockerfile
               load: true
               tags: smoke-test
               cache-from: type=gha
               cache-to: type=gha,mode=max

         -  name: Smoke-Test Image
            run: |
               docker run -d --name smoke-test -p 8080:80 smoke-test
               for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
               curl -sf -o /dev/null http://127.0.0.1:8080/index.html
               curl -sf -o /dev/null http://127.0.0.1:8080/js/parser.js
               curl -sf -o /dev/null http://127.0.0.1:8080/sw.js
               curl -sf -o /dev/null http://127.0.0.1:8080/search/index.json
               curl -sf -H 'Accept-Encoding: gzip' -D - -o /dev/null http://127.0.0.1:8080/data/races.json | grep -qi '^content-encoding: gzip'
               docker rm -f smoke-test

         -  name: Check Image Size
            run: |
               # The files themselves, unpacked: what `docker image inspect` reports depends on the image store
               mb=$(( $(docker export "$(docker create smoke-test)" | wc -c) / 1000000 ))
               echo "Image: ${mb} MB unpacked (budget ${SIZE_BUDGET_MB} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
               if [ "$mb" -gt "$SIZE_BUDGET_MB" ]; then
                  echo "::error::The image is ${mb} MB, over its ${SIZE_BUDGET_MB} MB budget. Did upstream add something large to the files its .dockerignore lets in?"
                  exit 1
               fi

         -  name: Log In to Registry
            uses: docker/login-action@v3
            with:
               registry: ${{ env.REGISTRY }}
               username: ${{ github.actor }}
               password: ${{ secrets.GITHUB_TOKEN }}

         -  name: Extract Image Metadata
            id: meta
            uses: docker/metadata-action@v5
            with:
               images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
               tags: |
                  type=ref,event=branch,enable=${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
                  type=raw,value=latest,enable={{is_default_branch}}
                  type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
                  type=sha

         -  name: Build and Push Image
            uses: docker/build-push-action@v6
            with:
               context: .
               file: docker/Dockerfile
               platforms: linux/amd64,linux/arm64
               push: true
               tags: ${{ steps.meta.outputs.tags }}
               labels: ${{ steps.meta.outputs.labels }}
               cache-from: type=gha
               cache-to: type=gha,mode=max
