# Example: a table that plays the 2024 books, with a shelf of homebrew already on.
#
# Copy this next to your own compose file and edit the two lists. Everything here is optional —
# with no environment set the container serves exactly the site it always did.
#
# See docs/DEFAULT_BOOKS.md for what the lists mean and where source codes come from.

services:
   5etools:
      image: ghcr.io/prinzwalium/5etools-src:latest
      # Or build the image yourself:
      # build: .
      ports:
         - "8080:80"
      environment:
         # Books to start *unticked*. These are the 2014 core three; their 2024 replacements
         # (XPHB / XMM / XDMG) are untouched and stay on.
         DEFAULT_DENY: "PHB,MM,DMG"

         # Homebrew to install on a visitor's first load. A title, a partial title (which takes
         # every book that matches — "Grim Hollow" is a shelf, not a file), a source code, or a
         # full URL to a JSON file. Semicolons, because titles contain commas.
         DEFAULT_BREW: >-
            Grim Hollow;
            Dungeons of Drakkenheim;
            Humblewood;
            D&D Beyond Drops;
            Critical Role

         # Only the books named here start ticked; everything else starts off. Left unset above,
         # because a deny list is usually the smaller edit — but this is the way to pin the site
         # to an exact shelf:
         # DEFAULT_LOAD: "XPHB,XMM,XDMG,XGE,TCE"
      restart: unless-stopped
